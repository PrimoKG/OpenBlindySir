name: openblindysir

services:
  app:
    image: openblindysir-server:local
    build:
      context: .
      target: app
    environment:
      BLIND_PASSWORD: "${BLIND_PASSWORD:?Run the Docker launcher first}"
      HOST_PASSWORD: "${HOST_PASSWORD:?Run the Docker launcher first}"
      BRIDGE_SECRET: "${BRIDGE_SECRET:?Run the Docker launcher first}"
      DOMAIN: ${DOMAIN:?Run the Docker launcher first}
      DEV_MODE: "0"
      BIND_HOST: "127.0.0.1"
      PORT: "8000"
      TRUSTED_PROXIES: "127.0.0.1/32,::1/128"
      STATIC_DIR: /opt/openblindysir/web
      LOG_TRACK_NAMES: "false"
      CLIP_FORMAT: ${CLIP_FORMAT:-aac}
    # Caddy and the Bridge share this network namespace. Port 8000 stays loopback-only.
    ports:
      - target: 443
        published: "${HTTPS_PORT:-8443}"
        host_ip: "${BIND_IP:-127.0.0.1}"
        protocol: tcp
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    init: true

  caddy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    network_mode: service:app
    depends_on:
      app:
        condition: service_healthy
        restart: true
    environment:
      TLS_HOST: ${TLS_HOST:?Run the Docker launcher first}
      TLS_SERVER_NAME: ${TLS_SERVER_NAME:-${TLS_HOST}}
    volumes:
      - ./deploy/Caddyfile.docker.${CADDY_PROFILE:-private}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8000/healthz]
      interval: 5s
      timeout: 3s
      retries: 12

  bridge:
    image: openblindysir-bridge:local
    build:
      context: .
      target: bridge
    network_mode: service:app
    depends_on:
      app:
        condition: service_healthy
        restart: true
    environment:
      OPENBLINDYSIR_BRIDGE_SERVER: http://127.0.0.1:8000
      OPENBLINDYSIR_BRIDGE_SECRET: ${BRIDGE_SECRET:?Run the Docker launcher first}
      OPENBLINDYSIR_BRIDGE_NAME: ${BRIDGE_NAME:-Docker Bridge}
      OPENBLINDYSIR_BRIDGE_DEMO: ${BRIDGE_DEMO:-false}
    volumes:
      - type: bind
        source: ${MUSIC_DIR:?Choose a music folder in the Docker launcher}
        target: /music
        read_only: true
        bind:
          create_host_path: false
      - bridge_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    init: true

volumes:
  caddy_data:
  caddy_config:
  bridge_data:
