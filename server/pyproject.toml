[project]
name = "openblindysir-server"
dynamic = ["version"]
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
description = "OpenBlindySir Server"
readme = { text = "Part of OpenBlindySir: https://github.com/PrimoKG/OpenBlindySir", content-type = "text/plain" }
dependencies = [
  "openblindysir-protocol==0.5.0.dev0",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9,<3",
]

[project.scripts]
openblindysir-server = "openblindysir_server.cli:main"

[tool.uv.sources]
openblindysir-protocol = { workspace = true }

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/openblindysir_server/_version.py" }]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/openblindysir_server/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openblindysir_server"]

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "openblindysir_server/LICENSE"
