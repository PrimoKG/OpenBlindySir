[project]
name = "openblindysir-bridge"
dynamic = ["version"]
requires-python = ">=3.12"
license = "MIT"
description = "OpenBlindySir Bridge"
readme = { text = "Part of OpenBlindySir: https://github.com/PrimoKG/OpenBlindySir", content-type = "text/plain" }
dependencies = [
  "openblindysir-protocol",
  "websockets>=13.1",
  "httpx>=0.27",
]

[project.scripts]
openblindysir-bridge = "openblindysir_bridge.cli:main"

[tool.uv.sources]
openblindysir-protocol = { workspace = true }

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/openblindysir_bridge"]

[tool.hatch.build.targets.wheel.force-include]
"../LICENSE" = "openblindysir_bridge/LICENSE"
