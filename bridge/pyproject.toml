[project]
name = "openblindysir-bridge"
dynamic = ["version"]
requires-python = ">=3.12,<3.15"
license = "MIT"
description = "OpenBlindySir Bridge"
readme = "README.md"
license-files = ["LICENSE"]
dependencies = [
  "openblindysir-protocol==0.5.0.dev0",
  "websockets>=13.1",
  "httpx>=0.27",
]

[project.scripts]
openblindysir-bridge = "openblindysir_bridge.cli:main"

[tool.uv.sources]
openblindysir-protocol = { workspace = true }

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/openblindysir_bridge/_version.py" }, { file = "README.md" }]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/openblindysir_bridge/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openblindysir_bridge"]

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "openblindysir_bridge/LICENSE"

[project.urls]
Homepage = "https://github.com/PrimoKG/OpenBlindySir"
Documentation = "https://github.com/PrimoKG/OpenBlindySir/blob/main/docs/bridge-installation.md"
Issues = "https://github.com/PrimoKG/OpenBlindySir/issues"
