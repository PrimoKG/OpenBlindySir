name: Nightly

# Long-running checks kept off the push path: the core fuzzer with the nightly Hypothesis
# profile, and the end-to-end game on WebKit (informative only, not an iOS validation).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest server/tests/game/test_game_properties.py
        env:
          HYPOTHESIS_PROFILE: nightly

  e2e-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sh tools/prepare_ci_ffmpeg.sh
      - run: uv sync --locked
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npx playwright install --with-deps webkit
        working-directory: web
      - run: npm --prefix web run e2e:webkit
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-webkit
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
