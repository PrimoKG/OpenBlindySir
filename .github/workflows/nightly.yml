name: Nightly

# Long-running checks kept off the push path: the core fuzzer with the nightly Hypothesis
# profile, and the end-to-end game on WebKit (informative only, not an iOS validation).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run pytest server/tests/game/test_game_properties.py
        env:
          HYPOTHESIS_PROFILE: nightly

  e2e-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: |
          sudo apt-get update && sudo apt-get install -y build-essential nasm pkg-config libmp3lame-dev libopus-dev libvorbis-dev xz-utils curl
          sh tools/install_ci_ffmpeg.sh
      - run: uv sync --locked
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npx playwright install --with-deps webkit
        working-directory: web
      - run: npm --prefix web run e2e:webkit
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-webkit
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
