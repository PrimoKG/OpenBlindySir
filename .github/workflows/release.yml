name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.12.22
      - run: uv sync --locked
      - run: uv run python tools/release.py verify --tag "$RELEASE_TAG" --require-clean
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  application:
    needs: version
    uses: ./.github/workflows/validation.yml

  distribution:
    needs: version
    uses: ./.github/workflows/distribution.yml

  provenance:
    needs: [application, distribution]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.12.22
      - run: uv sync --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: distribution-*
          merge-multiple: true
          path: dist/release
      - name: Validate all versions, commits, contents and hashes
        run: uv run python tools/release.py collect --directory dist/release --tag "$RELEASE_TAG" --require-clean
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 30

  pypi:
    needs: provenance
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.12.22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: dist/release
      - name: Check downloaded checksums
        working-directory: dist/release
        run: sha256sum -c SHA256SUMS
      - name: Publish protocol then Bridge using PyPI workflow identity
        run: |
          uv publish --trusted-publishing always dist/release/openblindysir_protocol-*.whl dist/release/openblindysir_protocol-*.tar.gz
          uv publish --trusted-publishing always dist/release/openblindysir_bridge-*.whl dist/release/openblindysir_bridge-*.tar.gz

  github:
    needs: [provenance, pypi]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: dist/release
      - run: sha256sum -c SHA256SUMS
        working-directory: dist/release
      - name: Publish validated files from this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          args=(--verify-tag --title "OpenBlindySir $RELEASE_TAG" --notes-file dist/release/release-notes.md)
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}" dist/release/*.zip dist/release/*.zip.sha256 dist/release/*.whl dist/release/*.tar.gz dist/release/SHA256SUMS dist/release/release-manifest.json dist/release/python-provenance.json
