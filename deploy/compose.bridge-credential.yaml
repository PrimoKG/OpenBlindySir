# One distinct Bridge on another device. Give each device its own UUID, file and volume.
name: openblindysir-bridge-private
services:
  bridge:
    image: openblindysir-bridge:local
    build:
      context: ..
      target: bridge
    environment:
      OPENBLINDYSIR_BRIDGE_SERVER: "${BRIDGE_SERVER:?Set the server HTTPS URL}"
      OPENBLINDYSIR_BRIDGE_CREDENTIALS_FILE: /credentials/issued.toml
      OPENBLINDYSIR_BRIDGE_ALLOW_FULL_REVIEW: ${BRIDGE_ALLOW_FULL_REVIEW:-false}
    volumes:
      - type: bind
        source: ${BRIDGE_CREDENTIALS_FILE:?Set a private UUID-bound TOML file}
        target: /credentials/issued.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MUSIC_DIR:?Set the music folder}
        target: /music
        read_only: true
        bind:
          create_host_path: false
      - bridge_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    init: true
volumes:
  bridge_data:
