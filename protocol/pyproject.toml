[project]
name = "openblindysir-protocol"
dynamic = ["version"]
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
description = "OpenBlindySir wire protocol (Pydantic models)"
readme = { text = "Part of OpenBlindySir: https://github.com/PrimoKG/OpenBlindySir", content-type = "text/plain" }
dependencies = [
  "pydantic>=2.9,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/openblindysir_protocol/_version.py" }]

[tool.hatch.version]
path = "src/openblindysir_protocol/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openblindysir_protocol"]

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "openblindysir_protocol/LICENSE"
