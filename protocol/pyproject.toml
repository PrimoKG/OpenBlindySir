[project]
name = "openblindysir-protocol"
dynamic = ["version"]
requires-python = ">=3.12"
license = "MIT"
description = "OpenBlindySir wire protocol (Pydantic models)"
readme = { text = "Part of OpenBlindySir: https://github.com/PrimoKG/OpenBlindySir", content-type = "text/plain" }
dependencies = [
  "pydantic>=2.9,<3",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/openblindysir_protocol"]

[tool.hatch.build.targets.wheel.force-include]
"../LICENSE" = "openblindysir_protocol/LICENSE"
